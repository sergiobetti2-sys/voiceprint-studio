[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceprint-studio"
version = "0.0.1"
description = "Desktop tools for creating, validating and exporting portable voiceprints"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
dependencies = [
    "numpy==2.4.6",
    "pyqtgraph==0.14.0",
    "PySide6==6.11.2",
    "scipy==1.17.1",
    "sounddevice==0.5.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "RUF"]
